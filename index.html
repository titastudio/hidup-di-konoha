            S.hidden.trauma = clamp(S.hidden.trauma + 2, 0, 100);
          }
        }
      }
    }},
    { w: 0.5, run: () => {
      if (chance(S.skills['public speaking'] / 300)) {
        S.viralCounter++;
        log('Postingan lo viral di X. 10k retweet. Notifikasi gak berhenti.', 'event');
        S.stats.stress += 6;
      }
    }}
  ]).run();
}

// ============ VITALS / DEATH ============
function checkVitals() {
  // Grace period: stat must stay at critical level for 2 consecutive ticks before death
  // Health
  if (S.stats.health <= 0) {
    S.flags.healthCrit = (S.flags.healthCrit || 0) + 1;
    if (S.flags.healthCrit >= 2) return die('Kesehatan habis. Kena gula, jantung, asam urat sekaligus karena indomie 12 tahun.');
    log('⚠ Tubuh lo nyaris kolaps. Istirahat dan makan sekarang!', 'bad');
    return;
  } else { S.flags.healthCrit = 0; }

  // Stress
  if (S.stats.stress >= 100) {
    S.flags.stressCrit = (S.flags.stressCrit || 0) + 1;
    if (S.flags.stressCrit >= 2) return die(`Burnout total. Mental collapse di hari ke-${S.day}.`);
    log('⚠ Mental lo di ujung. Butuh healing sekarang, bukan besok.', 'bad');
    return;
  } else { S.flags.stressCrit = 0; }

  // Lapar
  if (S.stats.lapar <= 0) {
    S.flags.laparCrit = (S.flags.laparCrit || 0) + 1;
    if (S.flags.laparCrit >= 2) return die('Mati kelaparan. Indonesia, 2026.');
    log('⚠ Lo belum makan sama sekali. Perut kosong, kepala pusing.', 'bad');
    return;
  } else { S.flags.laparCrit = 0; }

  // Happiness
  if (S.stats.happiness <= 0 && chance(0.08)) return die('Hilang harapan. Hidup terlalu berat ditanggung sendiri.');
}

function die(reason) {
  S.dead = true;
  S.causeOfDeath = reason;
  showGameOver();
}

// ============ RENDER ============
function render() {
  if (!S) return;
  $('t-date').textContent = `Hari ${S.day} / ${['Pagi','Siang','Sore','Malam'][S.timeOfDay]}`;
  const moneyEl = $('t-money');
  moneyEl.textContent = rupiah(S.money);
  moneyEl.className = 'value money' + (S.money < 30000 ? ' broke' : S.money < 200000 ? ' poor' : '');
  $('t-debt').textContent = rupiah(S.debts.reduce((s, d) => s + d.amount, 0));
  const stressEl = $('t-stress');
  stressEl.textContent = Math.round(S.stats.stress);
  stressEl.className = 'value stress' + (S.stats.stress > 80 ? ' crit' : S.stats.stress > 60 ? ' high' : '');
  $('t-loc').textContent = S.lokasi.kota;

  $('char-name').textContent = S.char.name;
  $('char-meta').textContent = `${Math.floor(S.char.umur)} thn • ${S.char.gender} • ${PEKERJAAN.find(p => p.id === S.job)?.nama || '—'}${S.generation > 1 ? ' • Gen ' + S.generation : ''}`;
  $('char-bg').innerHTML = `${S.char.bgLabel} • hobi ${S.char.hobi}<br><span style="font-size:9px;opacity:0.7">"${S.char.bgQuote || ''}"</span>${S.char.ancestor ? '<br><span style="font-size:9px;opacity:0.55">keturunan ' + S.char.ancestor + '</span>' : ''}`;
  const cb = $('char-class');
  cb.textContent = S.lokasi.class.replace('-', ' ').toUpperCase();
  cb.className = 'class-badge ' + S.lokasi.class;

  // Job info: kasih tau player jelas berapa hari lagi sampai gajian
  const ji = $('job-info');
  if (S.job !== 'pengangguran') {
    const p = PEKERJAAN.find(x => x.id === S.job);
    let cycleHtml = '';
    if (p.harian) {
      cycleHtml = `<div class="ji-payday">Bayaran cair tiap kerja (${rupiah(p.gaji[0])}–${rupiah(p.gaji[1])}/hari)</div>`;
    } else if (p.viral) {
      cycleHtml = `<div class="ji-payday">Penghasilan dari konten (variabel)</div>`;
    } else {
      const mult = S.salaryMult || 1;
      const gMin = Math.round(p.gaji[0] * mult);
      const gMax = Math.round(p.gaji[1] * mult);
      // Sisa hari ke gajian berikutnya (S.payday adalah hari absolut)
      let daysToPay;
      if (S.payday > 0) {
        daysToPay = Math.max(0, S.payday - S.day);
      } else {
        // job harian/viral: S.payday === 0, tidak tampilkan countdown
        daysToPay = 99;
      }
      const payCls = daysToPay === 0 ? 'today' : daysToPay <= 3 ? 'soon' : '';
      const payText = daysToPay === 0 ? 'HARI INI!' : daysToPay === 1 ? 'besok' : `${daysToPay} hari lagi`;
      cycleHtml = `
        <div style="margin-top:3px;color:var(--ink-soft);font-size:9px">${rupiah(gMin)}–${rupiah(gMax)}/bulan${mult > 1.01 ? ` <span style="color:var(--green)">(+${Math.round((mult-1)*100)}%)</span>` : ''}</div>
        <div class="ji-payday ${payCls}">Gajian: ${payText}</div>`;
    }
    ji.style.display = 'block';
    ji.innerHTML = `<span class="ji-label">Status Kerja</span><span class="ji-main">${p.nama}</span>${cycleHtml}`;
  } else {
    ji.style.display = 'block';
    ji.innerHTML = `<span class="ji-label">Status Kerja</span><span class="ji-main" style="color:var(--red)">Pengangguran</span><div class="ji-payday" style="color:var(--ink-soft)">Lamar kerja buat dapat penghasilan</div>`;
  }

  ['energi','lapar','hygiene','health','stress','happiness'].forEach(k => {
    const v = Math.round(S.stats[k]);
    $('lbl-' + k).textContent = v;
    const bar = $('bar-' + k);
    bar.style.width = v + '%';
    const isInverted = k === 'stress';
    const isLow = isInverted ? v > 75 : v < 25;
    bar.className = 'bar-fill ' + ({ energi: 'energy', lapar: 'lapar', hygiene: 'hygiene', health: 'health', stress: 'stress', happiness: 'happiness' }[k]) + (isLow ? ' warn' : '');
  });

  $('skills-list').innerHTML = Object.entries(S.skills).map(([k, v]) =>
    `<div style="display:flex;justify-content:space-between"><span>${k}</span><span style="color:var(--ink-soft)">${Math.round(v)}</span></div>`
  ).join('');
  $('hidden-list').innerHTML = Object.entries(S.hidden).map(([k, v]) =>
    `<div style="display:flex;justify-content:space-between"><span>${k.replace('_', ' ')}</span><span style="color:var(--ink-soft)">${Math.round(v)}</span></div>`
  ).join('');

  // Rebuild scene title robustly so we never lose the <small>
  const sceneTitle = $('scene-title');
  const timeLabels = ['Pagi','Siang','Sore','Malam'];
  // find first text node and replace its content; clear any other text nodes
  let textUpdated = false;
  sceneTitle.childNodes.forEach(n => {
    if (n.nodeType === Node.TEXT_NODE) {
      if (!textUpdated) { n.textContent = timeLabels[S.timeOfDay] + ' '; textUpdated = true; }
      else { n.textContent = ''; }
    }
  });
  $('scene-sub').textContent = `${S.lokasi.neigh} — ${S.lokasi.vibe}`;
  $('weather').textContent = S.weather.label;

  $('news-feed').innerHTML = S.newsBuffer.slice(0, 6).map(n =>
    `<div class="news-item ${n.cat}"><span class="cat">${n.cat}</span>${n.txt}</div>`
  ).join('') || '<div style="font-size:10px;color:var(--ink-soft);font-style:italic">Belum ada drama hari ini...</div>';

  $('relations-list').innerHTML = S.relations.map(r => `
    <div class="rel">
      <div><div class="name">${r.label}${r.debt > 0 ? ' <span style="color:var(--red);font-size:9px">[ngutang ' + rupiah(r.debt) + ']</span>' : ''}</div><div class="type">${r.type}</div></div>
      <div class="rel-bar"><div class="${r.trust > 50 ? '' : 'bad'}" style="width:${r.trust}%"></div></div>
    </div>`).join('');

  const debtItems = [];
  if (S.pendingBills.kontrakan) debtItems.push(`<div style="padding:4px 0;color:var(--red)"><strong>Kontrakan!</strong> ${rupiah(S.bills.kontrakan)} jatuh tempo</div>`);
  S.debts.forEach(d => debtItems.push(`<div style="padding:4px 0;border-bottom:1px dashed rgba(0,0,0,0.1)">
    <strong>${d.src}</strong><br>
    <span style="color:var(--red)">${rupiah(d.amount)}</span> <span style="color:var(--ink-soft);font-size:9px">@ ${(d.bunga*100).toFixed(0)}%/bln</span>
  </div>`));
  $('debt-list').innerHTML = debtItems.length ? debtItems.join('') : '<div style="color:var(--green);font-size:10px">Bebas hutang. Untuk sekarang.</div>';

  const topMission = S.missions.find(m => m.type === 'urgent') || S.missions.find(m => m.type === 'main') || S.missions[0];
  if (topMission) {
    $('mission-area').innerHTML = `
      <div class="mission-banner ${topMission.type === 'urgent' ? 'urgent' : ''}">
        <div class="mission-label">★ Misi: ${topMission.type.toUpperCase()}</div>
        <div class="mission-title">${topMission.label}</div>
        <div class="mission-desc">${topMission.desc}</div>
        <div class="mission-progress">REWARD: <span class="reward">${topMission.rewardText}</span></div>
      </div>`;
  } else $('mission-area').innerHTML = '';

  $('mission-list').innerHTML = S.missions.length ?
    S.missions.map(m => `<div style="padding:5px 0;border-bottom:1px dashed rgba(0,0,0,0.1)">
      <strong>${m.label}</strong> <span style="font-size:9px;color:var(--ink-soft);text-transform:uppercase">[${m.type}]</span><br>
      <span style="font-size:10px;color:var(--ink-soft)">${m.desc}</span>
    </div>`).join('') :
    '<div style="font-size:10px;color:var(--ink-soft);font-style:italic">Tidak ada misi aktif.</div>';
  $('mission-count').textContent = S.missions.length;

  renderActions();
  renderLog();
  renderTicker();
  $('action-hint').textContent = S.actionTaken ? 'pilih "lanjut →" ke blok berikutnya' : 'pilih 1 aksi';

  // Autosave — render() runs after every meaningful state change,
  // so this captures the whole gameplay loop without manual hooks.
  scheduleAutoSave();
}

function renderActions() {
  const wrap = $('actions');
  const actions = generateAvailableActions();
  const lanjut = actions.find(a => a.id === 'lanjut');
  const others = actions.filter(a => a.id !== 'lanjut');
  S._currentActions = {};
  actions.forEach(a => S._currentActions[a.id] = a);
  // when action already taken, only the time/advance button stays enabled
  const lockedByAction = S.actionTaken;
  wrap.innerHTML = [...others, lanjut].map(a => {
    const cantNow = a.can && !a.can();
    const isTime = !!a.isTime;
    const lockedHere = lockedByAction && !isTime;
    const disabled = cantNow || lockedHere;
    return `
    <button class="action-btn" data-id="${a.id}" data-type="${a.type || ''}" ${disabled ? 'disabled' : ''} ${lockedHere ? 'data-locked="1"' : ''}>
      <span class="title">${a.title}</span>
      <span class="sub">${a.sub || ''}</span>
      <span class="cost">${a.cost || ''}</span>
    </button>`;
  }).join('');
  wrap.querySelectorAll('.action-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) {
        if (btn.dataset.locked === '1') {
          showToast('Sudah pilih aksi', 'klik "Lanjut →" untuk blok berikutnya');
        }
        return;
      }
      const id = btn.dataset.id;
      const a = S._currentActions[id];
      if (!a) return;
      a.run();
    });
  });
}

function renderLog() {
  $('log').innerHTML = S.logBuffer.slice().reverse().slice(0, 25).map(l =>
    `<div class="log-entry ${l.type}"><span class="time">[H${l.day} ${l.time}]</span><span class="msg">${l.msg}</span></div>`
  ).join('');
}

function renderTicker() {
  const items = [
    { txt: 'IHSG ' + (chance(0.5) ? '+' : '-') + (Math.random()*2).toFixed(2) + '%', cls: chance(0.5) ? 'up' : 'down' },
    { txt: 'USD/IDR ' + irand(15800, 16400), cls: '' },
    { txt: 'BBM Pertalite Rp ' + irand(10000, 12500), cls: '' },
    { txt: 'Cabai merah Rp ' + irand(60000, 130000) + '/kg', cls: 'down' },
    { txt: 'Beras Rp ' + irand(14000, 18000) + '/kg', cls: '' },
    { txt: 'Trending: #' + pick(['kabinetbaru','viraltiktok','harganaikterus','blokirjudol','listrikbermasalah','korupsidinas']), cls: '' },
    { txt: 'BI rate ' + (5 + Math.random()).toFixed(2) + '%', cls: '' },
    { txt: 'Emas Rp ' + irand(1280000, 1380000) + '/gr', cls: 'up' }
  ];
  $('ticker').innerHTML = items.map(i => `<span class="ticker-item ${i.cls}">${i.txt}</span>`).join('');
}

// ============ MODAL ============
function openModal({ title, sub, body, choices, cancellable }) {
  modalOpen = true;
  $('modal-content').innerHTML = `
    <div class="modal-title">${title}</div>
    ${sub ? `<div class="modal-sub">${sub}</div>` : ''}
    ${body ? `<div class="modal-body">${body}</div>` : ''}
    <div class="modal-choices">
      ${choices.map((c, i) => `<button class="modal-choice" data-i="${i}" ${c.disabled ? 'disabled' : ''}>
        <strong>${c.label}</strong>
        ${c.hint ? `<span class="hint">${c.hint}</span>` : ''}
      </button>`).join('')}
      ${cancellable ? `<button class="modal-choice" data-i="-1" style="background:transparent;border:1px solid var(--ink-soft);color:var(--ink-soft)"><strong>← Batal</strong></button>` : ''}
    </div>`;
  $('modal').classList.add('show');
  $('modal-content').querySelectorAll('.modal-choice').forEach(b => {
    b.addEventListener('click', () => {
      if (b.disabled) return;
      const i = +b.dataset.i;
      closeModal();
      if (i >= 0 && choices[i]?.run) choices[i].run();
      render();
    });
  });
}

function closeModal() {
  $('modal').classList.remove('show');
  modalOpen = false;
}

function showToast(title, sub = '') {
  const t = $('toast');
  t.innerHTML = title + (sub ? `<span class="sub">${sub}</span>` : '');
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

// ============ NAV ============
document.querySelectorAll('.nav-btn[data-nav]').forEach(b => {
  b.addEventListener('click', () => {
    const target = b.dataset.nav;
    if (target === 'main') {
      closeAllPanels();
      return;
    }
    // open requested panel, close other
    const isOpen = $((target === 'left' ? 'leftPanel' : 'rightPanel')).classList.contains('open');
    closeAllPanels();
    if (!isOpen) {
      if (target === 'left') $('leftPanel').classList.add('open');
      if (target === 'right') $('rightPanel').classList.add('open');
      document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      $('panel-backdrop').classList.add('show');
    }
  });
});

function closeAllPanels() {
  $('leftPanel').classList.remove('open');
  $('rightPanel').classList.remove('open');
  $('panel-backdrop').classList.remove('show');
  document.querySelectorAll('.nav-btn[data-nav]').forEach(x => x.classList.remove('active'));
  const mainBtn = document.querySelector('.nav-btn[data-nav="main"]');
  if (mainBtn) mainBtn.classList.add('active');
}

// keep legacy name working but route to closeAllPanels for safety
function togglePanel(_id) { closeAllPanels(); }

// ============ GAME OVER ============
function showGameOver() {
  const totalDebt = S.debts.reduce((s, d) => s + d.amount, 0);
  const netWorth = S.money - totalDebt;
  modalOpen = true;
  // package inheritance for next gen
  S._inheritance = {
    fromName: S.char.name,
    generation: (S.generation || 1) + 1,
    trauma: clamp(Math.round(S.hidden.trauma * 0.5 + 10), 5, 80),
    ordal: Math.round(S.hidden.ordal * 0.6),
    luck: Math.round(S.hidden.luck * 0.5 + 25),
    family_burden: clamp(Math.round(S.hidden.family_burden * 0.4 + (totalDebt > 0 ? 25 : 5)), 0, 90),
    inheritedDebt: Math.round(totalDebt * 0.25),
    inheritedMoney: Math.max(0, Math.round(netWorth * 0.3)),
    inheritedReputation: S.viralCounter
  };
  $('modal-content').innerHTML = `
    <div class="game-over">
      <div class="modal-title" style="color:var(--red)">— HABIS —</div>
      <div class="modal-sub">${S.char.name}, ${Math.floor(S.char.umur)} tahun. ${S.lokasi.kota}.</div>
      <div class="obit">"${generateObituary()}"</div>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px"><strong>Sebab:</strong> ${S.causeOfDeath}</div>
      <div class="summary-grid">
        <div><div class="lbl">Hari hidup</div><div class="vl">${S.day}</div></div>
        <div><div class="lbl">Net worth</div><div class="vl" style="color:${netWorth >= 0 ? 'var(--green)' : 'var(--red)'}">${rupiah(netWorth)}</div></div>
        <div><div class="lbl">Kerjaan terakhir</div><div class="vl" style="font-size:13px">${PEKERJAAN.find(p => p.id === S.job)?.nama || '—'}</div></div>
        <div><div class="lbl">Misi selesai</div><div class="vl">${S.completedMissions}</div></div>
        <div><div class="lbl">Konten viral</div><div class="vl">${S.viralCounter}x</div></div>
        <div><div class="lbl">Trauma</div><div class="vl">${Math.round(S.hidden.trauma)}</div></div>
      </div>
      <div style="background:var(--bg);padding:10px;border:2px solid var(--ink);margin-bottom:10px;font-size:11px;line-height:1.5">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;margin-bottom:4px">YANG DIWARISKAN KE GENERASI BERIKUT:</div>
        <div>Trauma keluarga <strong>${S._inheritance.trauma}</strong> • Ordal <strong>${S._inheritance.ordal}</strong> • Beban <strong>${S._inheritance.family_burden}</strong></div>
        <div>Hutang warisan ${rupiah(S._inheritance.inheritedDebt)} • Uang warisan ${rupiah(S._inheritance.inheritedMoney)}</div>
      </div>
      <div class="modal-choices">
        <button class="modal-choice" id="next-gen-btn" style="background:var(--ink);color:var(--paper)">
          <strong>Lanjut sebagai generasi ${S._inheritance.generation}</strong>
          <span class="hint" style="color:rgba(245,239,225,0.7)">trauma diwariskan, cycle berulang</span>
        </button>
        <button class="modal-choice" id="full-reset-btn">
          <strong>Mulai bersih (generasi 1)</strong>
          <span class="hint">tanpa warisan apapun</span>
        </button>
      </div>
    </div>`;
  $('modal').classList.add('show');
  const inheritance = S._inheritance;
  // Persist the inheritance handoff IMMEDIATELY — if the player refreshes
  // after death without picking a path, they still get the warisan flow.
  savePendingInheritance(inheritance);
  // Character save is now invalid (player is dead) — clear it.
  clearSave();
  setSavePill(null, '— ' + S.char.name + ' meninggal');
  $('next-gen-btn').addEventListener('click', () => nextGeneration(inheritance));
  $('full-reset-btn').addEventListener('click', resetGame);
}

function nextGeneration(inh) {
  closeModal();
  // generate new candidates but inject inheritance
  S = null;
  $('log').innerHTML = '';
  $('actions').innerHTML = '';
  $('mission-area').innerHTML = '';
  modalOpen = true;
  $('modal-content').classList.add('intro-modal');
  const candidates = generateSpawnCandidates(4).map(c => ({ ...c, _inheritance: inh }));
  renderIntro(candidates);
  $('modal').classList.add('show');
  // Inheritance will be baked into S the moment a card is clicked (newGame).
  // We keep it in localStorage until then so a refresh on the spawn screen
  // re-offers the same warisan instead of dropping it silently.
}

function generateObituary() {
  if (S.causeOfDeath.includes('Burnout')) return pick([
    'Bekerja terlalu keras untuk hidup yang tidak pernah dia jalani.',
    'Mati di meja kerja, laptop masih nyala, Trello board kosong.',
    'Kerja overtime selamanya kecuali untuk dirinya sendiri.'
  ]);
  if (S.causeOfDeath.includes('kelaparan')) return pick([
    'Indonesia, negeri agraris katanya. Mati kelaparan beneran.',
    'Saldo ATM kosong, perut kosong, harapan kosong.'
  ]);
  if (S.causeOfDeath.includes('Kesehatan')) return pick([
    'Tubuh akhirnya menyerah setelah indomie + lembur tahunan.',
    'BPJS udah lama nunggak, kena diabetes + asam urat sekaligus.'
  ]);
  if (S.causeOfDeath.includes('harapan')) return pick([
    'Kadang yang bocor bukan atap, tapi hati.',
    'Hidup terlalu berat untuk dipikul sendiri. Tidak ada yang lihat.'
  ]);
  return 'Begitu saja, tanpa pengumuman, tanpa caption sedih.';
}

// ============ RESET ============
function confirmReset() {
  if (!S) {
    // No active char but reset clicked — wipe any stale save/inh too.
    clearSave();
    savePendingInheritance(null);
    setSavePill(null, '— belum tersimpan');
    startIntro();
    return;
  }
  modalOpen = true;
  $('modal-content').innerHTML = `
    <div class="modal-title" style="color:var(--red)">RESET HIDUP?</div>
    <div class="modal-sub">Hapus semua progress. Mulai dari awal dengan karakter random baru.</div>
    <div class="modal-choices">
      <button class="modal-choice" id="confirm-reset-yes" style="background:var(--red);color:var(--paper)">
        <strong>Ya, reset semuanya</strong>
        <span class="hint" style="color:rgba(245,239,225,0.7)">karakter, lokasi, hutang, semua hilang</span>
      </button>
      <button class="modal-choice" id="confirm-reset-no">
        <strong>Batal</strong>
      </button>
    </div>`;
  $('modal').classList.add('show');
  $('confirm-reset-yes').addEventListener('click', resetGame);
  $('confirm-reset-no').addEventListener('click', () => { closeModal(); render(); });
}

function resetGame() {
  closeModal();
  S = null;
  // Persistence: full reset wipes everything — character AND pending warisan.
  clearSave();
  savePendingInheritance(null);
  setSavePill(null, '— belum tersimpan');
  // bersihkan UI
  ['t-date','t-money','t-debt','t-stress','t-loc','char-name','char-meta','char-bg','char-class','log','news-feed','relations-list','debt-list','mission-list','mission-area','actions'].forEach(id => {
    const el = $(id);
    if (el) el.innerHTML = el.tagName === 'INPUT' ? '' : '—';
  });
  $('log').innerHTML = '';
  $('actions').innerHTML = '';
  $('mission-area').innerHTML = '';
  startIntro();
}

// ============ INTRO / SPAWN ============
function startIntro() {
  modalOpen = true;
  $('modal-content').classList.add('intro-modal');
  // If there's a pending inheritance from a prior death (still in storage),
  // inject it into the spawn candidates so the player picks up the warisan.
  const pendingInh = loadPendingInheritance();
  const candidates = generateSpawnCandidates(4);
  if (pendingInh) candidates.forEach(c => c._inheritance = pendingInh);
  renderIntro(candidates);
  $('modal').classList.add('show');
}

function renderIntro(candidates) {
  const inh = candidates[0] && candidates[0]._inheritance;
  $('modal-content').innerHTML = `
    <div class="modal-title">HIDUP <span>DI</span> KONOHA</div>
    <div class="modal-sub">Simulator hidup di negeri kepulauan yang chaotic, lucu, terlalu relatable.</div>
    <div style="font-size:11px;line-height:1.5;margin-bottom:14px">
      Tidak ada win state. Bertahan, naik kelas, atau collapse. Pilih takdir awal di bawah — atau roll ulang sampai dapet yang lo mau.
    </div>
    ${inh ? `<div style="background:var(--ink);color:var(--paper);padding:8px 10px;margin-bottom:12px;font-size:10px;line-height:1.4;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--red)">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;color:var(--gold)">GENERASI ${inh.generation} — keturunan ${inh.fromName}</div>
      <div>Mewarisi trauma ${inh.trauma}, ordal ${inh.ordal}, beban ${inh.family_burden}${inh.inheritedDebt > 50000 ? ', hutang ' + rupiah(inh.inheritedDebt) : ''}${inh.inheritedMoney > 100000 ? ', uang ' + rupiah(inh.inheritedMoney) : ''}.</div>
    </div>` : ''}
    <div id="spawn-list"></div>
    <button class="reroll-btn" id="reroll-btn">⟲ Roll ulang takdir</button>
    <div style="font-size:9px;color:var(--ink-soft);margin-top:10px;letter-spacing:1px;text-align:center">v2 • progress auto-saved di browser • RESET untuk hapus</div>`;
  $('spawn-list').innerHTML = candidates.map((c, i) => `
    <div class="spawn-card" data-i="${i}">
      <div class="spawn-name">${c.name}</div>
      <div>
        <span class="spawn-tag">${c.gender}</span>
        <span class="spawn-tag">${c.umur} thn</span>
        <span class="spawn-tag">hobi: ${c.hobi}</span>
      </div>
      <div class="spawn-loc"><strong>${c.bg.label}</strong> — ${c.kota} / ${c.neigh.label}</div>
      <div class="spawn-quote">"${c.bg.quote}"</div>
    </div>`).join('');
  $('spawn-list').querySelectorAll('.spawn-card').forEach(card => {
    card.addEventListener('click', () => {
      const i = +card.dataset.i;
      $('modal').classList.remove('show');
      $('modal-content').classList.remove('intro-modal');
      modalOpen = false;
      // Inheritance is now baked into the new S inside newGame — consume the
      // pending-inh storage slot so it doesn't double-apply on next death.
      if (candidates[i]._inheritance) savePendingInheritance(null);
      newGame(candidates[i]);
    });
  });
  $('reroll-btn').addEventListener('click', () => {
    const newCandidates = generateSpawnCandidates(4);
    if (candidates[0] && candidates[0]._inheritance) {
      newCandidates.forEach(c => c._inheritance = candidates[0]._inheritance);
    }
    renderIntro(newCandidates);
  });
}

$('logo').addEventListener('click', () => {
  if (!S || S.dead) startIntro();
});

// keyboard: Escape closes panels/modals; Enter advances time
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('panel-backdrop').classList.contains('show')) {
      closeAllPanels();
      e.preventDefault();
    } else if (modalOpen && !$('modal-content').querySelector('.game-over') && !$('modal-content').classList.contains('intro-modal')) {
      // only close cancellable modals (those with batal button visible)
      const batal = $('modal-content').querySelector('.modal-choice[data-i="-1"]');
      if (batal) { closeModal(); e.preventDefault(); }
    }
  }
});

// Flush any debounced save when the tab/page hides or closes.
// pagehide fires reliably on mobile (background, swipe-close) where
// beforeunload often does not.
function flushSaveImmediately() {
  if (!S || S.dead) return;
  if (saveDebounceTimer) { clearTimeout(saveDebounceTimer); saveDebounceTimer = null; }
  saveGame(true);
}
window.addEventListener('beforeunload', flushSaveImmediately);
window.addEventListener('pagehide', flushSaveImmediately);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSaveImmediately();
});

// ============ BOOT ============
function bootGame() {
  const saved = loadSavedGame();
  if (saved && saved.S && !saved.S.dead) {
    // Restore directly — full state is in S. Game continues from where
    // the last render() autosaved.
    try {
      S = saved.S;
      modalOpen = false;
      $('modal').classList.remove('show');
      $('modal-content').classList.remove('intro-modal');
      render();
      // Quick orientation toast so the player knows it's a resume.
      showToast(
        `Lanjut: ${S.char.name}`,
        `Hari ${S.day} • ${S.lokasi.kota} • save ${formatSaveAge(saved.savedAt)}`
      );
      const ts = new Date(saved.savedAt);
      const hh = String(ts.getHours()).padStart(2,'0');
      const mm = String(ts.getMinutes()).padStart(2,'0');
      setSavePill(null, `✓ tersimpan ${hh}:${mm}`);
      return;
    } catch (e) {
      console.warn('restore failed, falling back to intro:', e);
      clearSave();
    }
  }
  // No save (or corrupt / character dead): normal intro flow,
  // which itself will honor any pending inheritance still in storage.
  startIntro();
}

bootGame();
</script>
</body>
</html>
