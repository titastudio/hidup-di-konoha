<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#14110d" />
<title>HIDUP DI KONOHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece6d8;
    --bg-2: #d9cfb8;
    --ink: #14110d;
    --ink-soft: #3a342a;
    --paper: #f5efe1;
    --red: #c8261e;
    --green: #2d6a3a;
    --gold: #b9881d;
    --blue: #1b3a78;
    --magenta: #a8246b;
    --stress: #d94a1a;
    --shadow: 4px 4px 0 var(--ink);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  body {
    background-image:
      repeating-linear-gradient(0deg, rgba(20,17,13,0.025) 0, rgba(20,17,13,0.025) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at top left, #f0e8d2, var(--bg) 70%);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "top top top"
      "left main right"
      "bottom bottom bottom";
    height: 100%;
    height: 100dvh;
    max-width: 1700px;
    margin: 0 auto;
  }
  .topbar {
    grid-area: top;
    background: var(--ink);
    color: var(--paper);
    border-bottom: 3px solid var(--red);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 11px;
    overflow: hidden;
    white-space: nowrap;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--red);
    line-height: 1;
    cursor: pointer;
  }
  .logo span { color: var(--paper); }
  .top-stat {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
    padding-right: 12px;
    border-right: 1px solid #444;
  }
  .top-stat:last-of-type { border-right: none; }
  .top-stat .label {
    font-size: 9px;
    opacity: 0.5;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .top-stat .value {
    font-size: 14px;
    font-weight: 700;
    color: var(--paper);
  }
  .top-stat .value.money { color: #6dd66d; }
  .top-stat .value.money.poor { color: #ff8b3d; }
  .top-stat .value.money.broke { color: var(--red); animation: blink 0.8s infinite; }
  .top-stat .value.debt { color: #ff6b6b; }
  .top-stat .value.stress.high { color: #ff8b3d; }
  .top-stat .value.stress.crit { color: var(--red); animation: blink 0.6s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  .reset-btn {
    margin-left: auto;
    background: var(--red);
    color: var(--paper);
    border: 1.5px solid var(--paper);
    padding: 4px 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .reset-btn:hover { background: var(--paper); color: var(--red); }

  .left {
    grid-area: left;
    background: var(--paper);
    border-right: 2px solid var(--ink);
    padding: 14px;
    overflow-y: auto;
  }
  .panel-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 4px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .panel-title small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0;
    opacity: 0.5;
  }
  .stat-row { margin-bottom: 8px; }
  .stat-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 3px;
    color: var(--ink-soft);
  }
  .stat-label .v { color: var(--ink); font-weight: 700; }
  .bar {
    height: 10px;
    background: var(--bg-2);
    border: 1.5px solid var(--ink);
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    background: var(--green);
    position: relative;
  }
  .bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(255,255,255,0.15) 3px, rgba(255,255,255,0.15) 6px);
  }
  .bar-fill.energy { background: #4a90c8; }
  .bar-fill.lapar { background: #d49520; }
  .bar-fill.hygiene { background: #5db896; }
  .bar-fill.stress { background: var(--stress); }
  .bar-fill.happiness { background: #d4af3c; }
  .bar-fill.health { background: var(--green); }
  .bar-fill.warn { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  .character-card {
    background: var(--ink);
    color: var(--paper);
    padding: 10px;
    margin-bottom: 14px;
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
  }
  .character-card .name {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 20px;
    line-height: 1;
  }
  .character-card .meta {
    font-size: 9px;
    opacity: 0.6;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .character-card .background {
    font-size: 10px;
    opacity: 0.85;
    margin-top: 6px;
    font-style: italic;
    font-family: 'Instrument Serif', serif;
    line-height: 1.4;
  }
  .class-badge {
    display: inline-block;
    background: var(--red);
    color: var(--paper);
    padding: 2px 6px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 6px;
  }
  .class-badge.sangat-miskin { background: #4a3a2a; }
  .class-badge.miskin { background: #8b6a3a; }
  .class-badge.lower { background: var(--gold); }
  .class-badge.middle { background: var(--green); }
  .class-badge.kaya { background: var(--blue); }
  .class-badge.crazy { background: var(--magenta); }

  .job-info {
    margin-top: 10px;
    padding: 7px 9px;
    background: var(--paper);
    border-left: 3px solid var(--blue);
    font-size: 10px;
    line-height: 1.45;
  }
  .job-info .ji-label {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.55;
    display: block;
    margin-bottom: 2px;
  }
  .job-info .ji-main { font-weight: 700; color: var(--ink); }
  .job-info .ji-payday {
    margin-top: 3px;
    color: var(--green);
    font-weight: 500;
  }
  .job-info .ji-payday.soon { color: var(--gold); }
  .job-info .ji-payday.today { color: var(--red); font-weight: 700; }

  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 16px;
    background: var(--bg);
    position: relative;
  }
  .main::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(20,17,13,0.04) 1px, transparent 1px);
    background-size: 14px 14px;
    pointer-events: none;
  }
  .scene-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
    gap: 10px;
    flex-wrap: wrap;
  }
  .scene-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    line-height: 1;
    letter-spacing: 1px;
  }
  .scene-title small {
    display: block;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-soft);
    letter-spacing: 0;
    margin-top: 2px;
  }
  .weather-pill {
    background: var(--ink);
    color: var(--paper);
    padding: 6px 10px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
  }

  .mission-banner {
    background: linear-gradient(135deg, #fff9e0 0%, #ffd8a8 100%);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 10px 12px;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
  }
  .mission-banner.urgent { background: linear-gradient(135deg, #ffe0e0 0%, #ffb0b0 100%); }
  .mission-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--red);
    margin-bottom: 2px;
  }
  .mission-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    line-height: 1.1;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .mission-desc {
    font-size: 11px;
    line-height: 1.4;
    color: var(--ink-soft);
  }
  .mission-progress {
    margin-top: 6px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .mission-progress .reward {
    color: var(--green);
    font-size: 10px;
    margin-left: 6px;
  }

  .log {
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 12px;
    margin-bottom: 14px;
    max-height: 200px;
    overflow-y: auto;
    position: relative;
    z-index: 1;
  }
  .log-entry {
    padding: 6px 0;
    border-bottom: 1px dashed rgba(20,17,13,0.15);
    font-size: 12px;
    line-height: 1.5;
    animation: slideIn 0.25s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .time {
    color: var(--ink-soft);
    font-size: 9px;
    margin-right: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .log-entry.good .msg::before { content: '✓ '; color: var(--green); font-weight: 700; }
  .log-entry.bad .msg::before { content: '✗ '; color: var(--red); font-weight: 700; }
  .log-entry.event .msg::before { content: '◆ '; color: var(--magenta); font-weight: 700; }
  .log-entry.mission .msg::before { content: '★ '; color: var(--gold); font-weight: 700; }

  .actions-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .actions-title small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0;
    color: var(--ink-soft);
    text-transform: none;
  }
  .actions {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .action-btn {
    background: var(--paper);
    border: 2px solid var(--ink);
    padding: 10px 8px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    transition: transform 0.08s, box-shadow 0.08s;
    box-shadow: 3px 3px 0 var(--ink);
    position: relative;
    overflow: hidden;
  }
  .action-btn:hover:not(:disabled) {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .action-btn:active:not(:disabled) {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  .action-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: 1px 1px 0 var(--ink);
  }
  .action-btn .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    display: block;
    line-height: 1;
    margin-bottom: 2px;
  }
  .action-btn .sub {
    font-size: 10px;
    display: block;
    color: var(--ink-soft);
    margin-bottom: 3px;
    line-height: 1.2;
  }
  .action-btn .cost {
    font-size: 9px;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
  }
  .action-btn[data-type="hustle"] { background: linear-gradient(135deg, var(--paper) 60%, #ffe9b0 60%); }
  .action-btn[data-type="bad"] { background: linear-gradient(135deg, var(--paper) 60%, #ffd0d0 60%); }
  .action-btn[data-type="good"] { background: linear-gradient(135deg, var(--paper) 60%, #d3e8d8 60%); }
  .action-btn[data-type="time"] {
    background: var(--ink);
    color: var(--paper);
    box-shadow: 3px 3px 0 var(--red);
  }
  .action-btn[data-type="time"] .sub, .action-btn[data-type="time"] .cost { color: rgba(245,239,225,0.6); }

  .right {
    grid-area: right;
    background: var(--paper);
    border-left: 2px solid var(--ink);
    padding: 14px;
    overflow-y: auto;
  }
  .news-feed { margin-bottom: 14px; }
  .news-item {
    border-left: 3px solid var(--red);
    padding: 6px 0 6px 8px;
    margin-bottom: 8px;
    font-size: 11px;
    line-height: 1.4;
    animation: slideIn 0.3s ease-out;
  }
  .news-item .cat {
    display: inline-block;
    background: var(--ink);
    color: var(--paper);
    padding: 1px 5px;
    font-size: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-right: 4px;
    vertical-align: 1px;
  }
  .news-item.politik { border-left-color: var(--blue); }
  .news-item.korupsi { border-left-color: var(--red); }
  .news-item.artis { border-left-color: var(--magenta); }
  .news-item.tiktok { border-left-color: var(--gold); }
  .news-item.ekonomi { border-left-color: var(--green); }
  .news-item.absurd { border-left-color: #8b6a3a; }
  .news-item.mistis { border-left-color: #6a3a8b; }

  .relations-list .rel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px dashed rgba(20,17,13,0.15);
    font-size: 11px;
  }
  .relations-list .rel .name { font-weight: 700; }
  .relations-list .rel .type { font-size: 9px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1px; }
  .rel-bar { width: 50px; height: 4px; background: var(--bg-2); border: 1px solid var(--ink); }
  .rel-bar > div { height: 100%; background: var(--green); }
  .rel-bar > div.bad { background: var(--red); }

  .bottom {
    grid-area: bottom;
    background: var(--ink);
    border-top: 3px solid var(--red);
    display: flex;
    justify-content: space-around;
    padding: 6px 0;
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--paper);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 6px 10px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s;
    position: relative;
  }
  .nav-btn.active { opacity: 1; color: var(--red); }
  .nav-btn.active::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 2px;
    background: var(--red);
  }
  .nav-icon { font-size: 14px; display: block; }
  /* On desktop the left & right panels are always visible in the grid,
     so the Diri/Dunia drawer buttons have nothing to open. Hide them
     and let the "Aksi" button sit centered & passive. */
  @media (min-width: 1025px) {
    .nav-btn[data-nav="left"],
    .nav-btn[data-nav="right"] { display: none; }
    .bottom { padding: 4px 0; }
    .nav-btn[data-nav="main"] { opacity: 0.7; cursor: default; }
    .nav-btn[data-nav="main"].active::after { display: none; }
  }

  /* Save indicator pill — quiet, lives in the topbar */
  .save-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 3px 7px;
    border: 1px solid rgba(245,239,225,0.25);
    color: rgba(245,239,225,0.55);
    background: transparent;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .save-pill:hover { color: var(--paper); border-color: var(--paper); }
  .save-pill.saving { color: var(--gold); border-color: var(--gold); }
  .save-pill.saved { color: #6dd66d; border-color: rgba(109,214,109,0.5); }
  .save-pill.error { color: var(--red); border-color: var(--red); animation: blink 0.8s 3; }
  @media (max-width: 600px) {
    .save-pill { font-size: 8px; padding: 2px 5px; letter-spacing: 0.5px; }
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 17, 13, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--paper);
    border: 3px solid var(--ink);
    box-shadow: 8px 8px 0 var(--red);
    max-width: 540px;
    width: 100%;
    padding: 20px;
    max-height: 90vh;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    line-height: 1;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .modal-sub {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .modal-body {
    font-size: 12px;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .modal-choices {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .modal-choice {
    background: var(--bg);
    border: 2px solid var(--ink);
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.1s;
    color: var(--ink);
  }
  .modal-choice:hover:not(:disabled) {
    background: var(--ink);
    color: var(--paper);
  }
  .modal-choice:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .modal-choice .hint {
    display: block;
    font-size: 9px;
    color: var(--ink-soft);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .modal-choice:hover:not(:disabled) .hint { color: var(--paper); opacity: 0.7; }

  .game-over { text-align: center; }
  .game-over .obit {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 16px;
    line-height: 1.5;
    padding: 14px 0;
    border-top: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    margin: 14px 0;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    text-align: left;
    font-size: 11px;
    margin-bottom: 14px;
  }
  .summary-grid > div {
    background: var(--bg);
    padding: 8px;
    border: 1.5px solid var(--ink);
  }
  .summary-grid .lbl {
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .summary-grid .vl {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1px;
  }

  .ticker {
    overflow: hidden;
    flex: 1;
    position: relative;
    min-width: 0;
    height: 14px;
  }
  .ticker-track {
    display: inline-block;
    white-space: nowrap;
    animation: ticker 50s linear infinite;
    padding-left: 100%;
  }
  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }
  .ticker-item {
    display: inline-block;
    margin-right: 30px;
    font-size: 10px;
    letter-spacing: 1px;
  }
  .ticker-item.up { color: #6dd66d; }
  .ticker-item.down { color: #ff6b6b; }

  .intro-modal { max-width: 600px; }
  .intro-modal .modal-title { font-size: 36px; color: var(--red); }
  .intro-modal .modal-title span { color: var(--ink); }

  .spawn-card {
    background: var(--bg);
    border: 2px solid var(--ink);
    padding: 14px;

// ============ STATE ============
let S = null;
let modalOpen = false;

// ============ PERSISTENCE ============
// Single source-of-truth save: full S object + any pending inheritance
// handoff (so a refresh mid-spawn after dying still carries warisan).
// Versioned key — bump when schema breaks compatibility.
const SAVE_KEY = 'hidup-konoha-save-v2';
const PENDING_INH_KEY = 'hidup-konoha-pending-inh-v2';
let saveDebounceTimer = null;
let savePillResetTimer = null;

function setSavePill(state, text) {
  const el = document.getElementById('save-pill');
  if (!el) return;
  el.classList.remove('saving','saved','error');
  if (state) el.classList.add(state);
  if (text) el.textContent = text;
  if (savePillResetTimer) clearTimeout(savePillResetTimer);
  if (state === 'saved') {
    savePillResetTimer = setTimeout(() => {
      el.classList.remove('saved');
      const ts = new Date();
      const hh = String(ts.getHours()).padStart(2,'0');
      const mm = String(ts.getMinutes()).padStart(2,'0');
      el.textContent = `✓ tersimpan ${hh}:${mm}`;
    }, 1100);
  }
}

function saveGame(silent) {
  if (!S) return false;
  try {
    const payload = {
      v: 2,
      savedAt: Date.now(),
      S: S
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    if (!silent) setSavePill('saved', '✓ tersimpan');
    return true;
  } catch (e) {
    // QuotaExceeded or storage disabled (private mode, blocked, etc.)
    console.warn('save failed:', e);
    if (!silent) setSavePill('error', '⚠ save gagal');
    return false;
  }
}

// Debounced autosave — render() is called after every state mutation,
// so we hook there. Debounce prevents thrashing during burst renders.
function scheduleAutoSave() {
  if (!S || S.dead) return;
  if (saveDebounceTimer) clearTimeout(saveDebounceTimer);
  setSavePill('saving', '… menyimpan');
  saveDebounceTimer = setTimeout(() => {
    saveGame(false);
  }, 400);
}

function manualSave() {
  if (!S) {
    setSavePill('error', '⚠ belum ada game');
    setTimeout(() => setSavePill(null, '— belum tersimpan'), 1500);
    return;
  }
  if (saveDebounceTimer) { clearTimeout(saveDebounceTimer); saveDebounceTimer = null; }
  saveGame(false);
}

function loadSavedGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const payload = JSON.parse(raw);
    if (!payload || payload.v !== 2 || !payload.S) return null;
    // sanity: must have the core shape
    const s = payload.S;
    if (!s.char || !s.stats || !s.lokasi || typeof s.day !== 'number') return null;
    // ── Migration: fields added after initial v2 release ──
    // salaryMult: per-player salary multiplier (default 1x)
    if (typeof s.salaryMult !== 'number') s.salaryMult = 1;
    // lastPaidDay: absolute day last paid / job started (0 = never)
    if (typeof s.lastPaidDay !== 'number') s.lastPaidDay = 0;
    // payday: absolute day of next payday. Old saves stored it as a day-of-month (1–30).
    // If old value looks like a day-of-month (≤ 30) and the player has a job, convert to an
    // absolute day that is at least 1 day in the future so the cycle resumes cleanly.
    if (typeof s.payday !== 'number') {
      s.payday = 0;
    } else if (s.payday > 0 && s.payday <= 30 && s.job && s.job !== 'pengangguran') {
      // Heuristic: old-style modulo value. Bump it forward by ~15 days from current day.
      s.payday = s.day + 15;
    }
    // bills.listrik: added later; default 0
    if (s.bills && typeof s.bills.listrik !== 'number') s.bills.listrik = 0;
    // pendingBills: default object
    if (!s.pendingBills) s.pendingBills = { kontrakan: false };
    // flags: default object
    if (!s.flags) s.flags = {};
    return payload;
  } catch (e) {
    console.warn('load failed:', e);
    return null;
  }
}

function clearSave() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch (e) { /* ignore */ }
}

function savePendingInheritance(inh) {
  try {
    if (inh) localStorage.setItem(PENDING_INH_KEY, JSON.stringify(inh));
    else localStorage.removeItem(PENDING_INH_KEY);
  } catch (e) { /* ignore */ }
}

function loadPendingInheritance() {
  try {
    const raw = localStorage.getItem(PENDING_INH_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function formatSaveAge(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return 'baru saja';
  if (min < 60) return min + ' menit lalu';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + ' jam lalu';
  const d = Math.floor(hr / 24);
  return d + ' hari lalu';
}

// ============ SPAWN ============
function generateSpawnCandidates(n = 4) {
  const candidates = [];
  for (let i = 0; i < n; i++) {
    const bg = pick(BACKGROUND_LIST);
    const validNeighs = NEIGHBORHOOD_ARCH.filter(nh =>
      nh.class === bg.loc_class ||
      (bg.loc_class === 'sangat-miskin' && nh.class === 'miskin') ||
      (bg.loc_class === 'miskin' && nh.class === 'sangat-miskin') ||
      (bg.loc_class === 'lower' && nh.class === 'miskin') ||
      (bg.loc_class === 'middle' && nh.class === 'lower') ||
      (bg.loc_class === 'kaya' && nh.class === 'middle')
    );
    const neigh = pick(validNeighs.length ? validNeighs : NEIGHBORHOOD_ARCH);
    const pulauName = pick(Object.keys(PULAU));
    const kota = pick(PULAU[pulauName]);
    candidates.push({
      bg, neigh, pulauName, kota,
      name: pick(NAMA_DEPAN) + ' ' + pick(NAMA_BLKG),
      gender: chance(0.5) ? 'Laki' : 'Perempuan',
      umur: irand(20, 32),
      hobi: pick(HOBI_POOL)
    });
  }
  return candidates;
}

function newGame(spawn) {
  modalOpen = false;
  const bg = spawn.bg;
  const neigh = spawn.neigh;
  const inh = spawn._inheritance || null;
  S = {
    char: {
      name: spawn.name, gender: spawn.gender, umur: spawn.umur,
      umurStart: spawn.umur, bgLabel: bg.label, bgQuote: bg.quote, hobi: spawn.hobi,
      ancestor: inh ? inh.fromName : null
    },
    day: 1, timeOfDay: 0, actionTaken: false,
    lokasi: {
      pulau: spawn.pulauName, kota: spawn.kota, neigh: neigh.label, neighId: neigh.id,
      class: neigh.class, biaya: neigh.biaya, peluang: neigh.peluang, vibe: neigh.vibe
    },
    money: irand(bg.money[0], bg.money[1]) + (inh ? inh.inheritedMoney : 0),
    debts: [],
    job: 'pengangguran', jobStreak: 0,
    payday: irand(7, 14), lastSalary: 0,
    // lastPaidDay = hari absolut terakhir kali dibayar (atau hari mulai kerja kalau belum pernah gajian)
    // dipake buat hitung gaji pro-rata kalau resign sebelum gajian berikutnya.
    lastPaidDay: 0,
    // salaryMult = pengali gaji per-player (untuk promosi/demosi). Hindari mutate PEKERJAAN global!
    salaryMult: 1,
    stats: {
      energi: 80, lapar: 60, hygiene: 75, health: 85,
      stress: 10 + Math.round(bg.trauma * 0.18) + (inh ? Math.round(inh.trauma * 0.1) : 0),
      happiness: 55
    },
    skills: {
      'kerja keras': irand(20, 50),
      'public speaking': bg.traits.public_speaking || irand(10, 30),
      'coding': bg.traits.coding || irand(5, 20),
      'driving': bg.traits.driving || irand(20, 50),
      'negosiasi': bg.traits.negotiation || irand(10, 35),
      'memasak': irand(15, 50)
    },
    hidden: {
      luck: irand(35, 70) + (inh ? Math.round((inh.luck - 50) * 0.3) : 0),
      trauma: bg.trauma + (inh ? Math.round(inh.trauma * 0.6) : 0),
      loneliness: irand(20, 50),
      ordal: bg.ordal + (inh ? Math.round(inh.ordal * 0.5) : 0),

      family_burden: bg.burden + (inh ? Math.round(inh.family_burden * 0.4) : 0),

    },
    relations: [], addictions: {}, newsBuffer: [], logBuffer: [],
    lastJobApplyDay: -10, viralCounter: 0,
    bills: { kontrakan: Math.round(neigh.biaya * 700000), kontrakanDueDay: 5, listrik: 0, kontrakanOverdueSince: null },
    pendingBills: { kontrakan: false },
    weather: pick(WEATHER_POOL),
    flags: {},
    missions: [], completedMissions: 0, completedMissionsList: [],
    generation: inh ? inh.generation : 1, dead: false, causeOfDeath: null
  };
  // clamp the inherited stats
  S.hidden.luck = clamp(S.hidden.luck, 0, 100);
  S.hidden.trauma = clamp(S.hidden.trauma, 0, 100);
  S.hidden.ordal = clamp(S.hidden.ordal, 0, 100);
  S.hidden.family_burden = clamp(S.hidden.family_burden, 0, 100);
  S.stats.stress = clamp(S.stats.stress, 0, 100);

    const debtAmt = irand(bg.debt[0], bg.debt[1]);

        src: pick(['Pinjol legal','Hutang teman lama','Cicilan motor','Paylater Shopee','Hutang ke saudara']),

    S.debts.push({

  for (let i = 0; i < irand(4, 7) && relPool.length; i++) {
    const t = relPool.splice(Math.floor(Math.random() * relPool.length), 1)[0];

function generateInitialMissions() {
  if (S.job === 'pengangguran') addMission('cariKerja');
  addMission('uangSeratus');
  addMission('survive7days');
}

function addMission(key) {
  if (S.missions.find(m => m.key === key)) return;
  const tpl = MISSION_TEMPLATES[key];
  if (!tpl) return;
  const m = { key, label: tpl.label, desc: tpl.desc(), type: tpl.type, rewardText: tpl.rewardText, addedDay: S.day };
  if (tpl.setup) tpl.setup(m);
  S.missions.push(m);
  log('Misi baru: ' + tpl.label, 'mission');
}

function checkMissions() {
  for (let i = S.missions.length - 1; i >= 0; i--) {
    const m = S.missions[i];
    const tpl = MISSION_TEMPLATES[m.key];
    if (!tpl) { S.missions.splice(i, 1); continue; }
    m.desc = tpl.desc();
    if (tpl.failCheck && tpl.failCheck(m)) {
      log('Misi gagal: ' + m.label, 'bad');
      S.missions.splice(i, 1);
      continue;
    }
    if (tpl.check(m)) {
      log('✓ Misi selesai: ' + m.label + ' (' + m.rewardText + ')', 'mission');
      tpl.reward();
      S.completedMissions++;
      S.completedMissionsList.push(m.key);
      S.missions.splice(i, 1);
    }
  }
  const openSlots = 3 - S.missions.length;
  if (openSlots > 0) {
    const candidates = Object.keys(MISSION_TEMPLATES).filter(k => {
      if (S.missions.find(m => m.key === k)) return false;
      const tpl = MISSION_TEMPLATES[k];
      if (!tpl.canSpawn || !tpl.canSpawn()) return false;
      if (S.completedMissionsList.includes(k)) return false;
      return true;
    });
    if (candidates.length > 0) addMission(pick(candidates));
  }
}

function markMissionDone(key) {
  const m = S.missions.find(x => x.key === key);
  if (m) m.done = true;
}

// ============ LOG / NEWS ============
function log(msg, type = '') {
  if (!S) return;
  S.logBuffer.push({ time: ['PAGI','SIANG','SORE','MALAM'][S.timeOfDay], msg, type, day: S.day });
  if (S.logBuffer.length > 80) S.logBuffer.shift();
  renderLog();
}

function rollNews(n = 1) {
  for (let i = 0; i < n; i++) S.newsBuffer.unshift({ ...pick(BERITA_POOL), day: S.day });
  if (S.newsBuffer.length > 12) S.newsBuffer.length = 12;
}

// ============ TIME ============
function advanceTime(skipReq = false) {
  if (!S || S.dead || modalOpen) return;
  if (!skipReq && !S.actionTaken) {
    showToast('Pilih aksi dulu', 'satu aksi per blok waktu');
    return;
  }
  S.timeOfDay++;
  S.actionTaken = false;
  tickStats();
  if (S.timeOfDay > 3) {
    S.timeOfDay = 0;
    S.day++;
    S.char.umur += 1 / 365;
    newDay();
  }
  if (chance(0.18)) randomEvent();
  if (chance(0.30)) rollNews(1);
  if (chance(0.20)) S.weather = pick(WEATHER_POOL);
  // weather effects per tick
  const w = S.weather.effect;
  if (w.stress) S.stats.stress = clamp(S.stats.stress + w.stress / 4, 0, 100);
  if (w.energi) S.stats.energi = clamp(S.stats.energi + w.energi / 4, 0, 100);
  if (w.hygiene) S.stats.hygiene = clamp(S.stats.hygiene + w.hygiene / 4, 0, 100);
  if (w.health) S.stats.health = clamp(S.stats.health + w.health / 4, 0, 100);
  checkMissions();
  checkVitals();
  render();
}

function tickStats() {
  S.stats.lapar = clamp(S.stats.lapar - irand(3, 7), 0, 100);
  S.stats.energi = clamp(S.stats.energi - irand(2, 5), 0, 100);
  S.stats.hygiene = clamp(S.stats.hygiene - irand(2, 4), 0, 100);
  if (S.stats.lapar < 10) {
    S.stats.health = clamp(S.stats.health - 2, 0, 100);
    S.stats.stress = clamp(S.stats.stress + 3, 0, 100);
  }
  if (S.stats.stress > 75) {
    S.stats.happiness = clamp(S.stats.happiness - 1, 0, 100);
    if (chance(0.5)) S.stats.health = clamp(S.stats.health - 1, 0, 100);
  }
  if (S.stats.hygiene < 20) S.stats.health = clamp(S.stats.health - 1, 0, 100);
  if (S.stats.energi < 20) S.stats.stress = clamp(S.stats.stress + 2, 0, 100);
  // skill decay sangat lambat - 1 in ~25 ticks
  if (chance(0.04)) {
    const keys = Object.keys(S.skills);
    const k = pick(keys);
    if (S.skills[k] > 5) S.skills[k] = clamp(S.skills[k] - 0.5, 0, 100);
  }
}

function newDay() {
  for (const d of S.debts) d.amount = Math.round(d.amount * (1 + d.bunga / 30));
  // listrik billed once a month on day 10
  if ((S.day % 30) === 10) {
    const baseListrik = Math.round(80000 + S.lokasi.biaya * 100000 + (S.bills.listrik || 0));
    if (S.money >= baseListrik) {
      S.money -= baseListrik;
      log(`Listrik bulan ini ${rupiah(baseListrik)} kepotong otomatis.`, '');
    } else {
      S.debts.push({ src: 'PLN nunggak', amount: baseListrik, bunga: 0.02 });
      log(`Listrik nggak kebayar (${rupiah(baseListrik)}). Listrik nyaris dicabut.`, 'bad');
      S.stats.stress = clamp(S.stats.stress + 6, 0, 100);
    }
    S.bills.listrik = 0;
  }
  // Gajian: S.payday adalah hari absolut kapan gajian berikutnya cair (bukan modulo)
  if (S.job !== 'pengangguran' && S.payday > 0 && S.day >= S.payday) {
    const p = PEKERJAAN.find(p => p.id === S.job);
    if (p && !p.harian && !p.viral) {
      // Pengali gaji per-player, bukan mutate PEKERJAAN global
      const mult = S.salaryMult || 1;
      const gaji = Math.round(irand(p.gaji[0], p.gaji[1]) * mult);
      S.money += gaji;
      S.lastSalary = gaji;
      S.lastPaidDay = S.day;
      // Jadwalkan gajian berikutnya 30 hari lagi
      S.payday = S.day + 30;
      log(`GAJIAN ${rupiah(gaji)} masuk rekening. Gajian berikutnya hari ke-${S.payday}.`, 'good');
      showToast('GAJIAN', rupiah(gaji));
    }
  }
  if ((S.day % 30) === S.bills.kontrakanDueDay) {
    S.pendingBills.kontrakan = true;
    S.bills.kontrakanOverdueSince = S.day;
    log(`Kontrakan jatuh tempo: ${rupiah(S.bills.kontrakan)}. Bayar atau diusir.`, 'bad');
  }
  if (S.pendingBills.kontrakan && S.bills.kontrakanOverdueSince && (S.day - S.bills.kontrakanOverdueSince) > 5) {
    log('Ibu kos ngamuk via WA. Tinggal hitungan hari sebelum diusir.', 'bad');
    S.stats.stress = clamp(S.stats.stress + 8, 0, 100);
    if ((S.day - S.bills.kontrakanOverdueSince) > 12 && chance(0.3)) {
      log('Ibu kos beneran usir lo. Barang di gerbang. Lo pindah ke kos lebih kumuh.', 'bad');
      S.bills.kontrakan = Math.round(S.bills.kontrakan * 0.65);
      S.lokasi.biaya = Math.max(0.30, S.lokasi.biaya - 0.15);
      S.lokasi.vibe = 'kos darurat, kamar 2x2, kamar mandi luar';
      S.pendingBills.kontrakan = false;
      S.bills.kontrakanOverdueSince = null;
      S.stats.stress = clamp(S.stats.stress + 20, 0, 100);
      S.stats.happiness = clamp(S.stats.happiness - 15, 0, 100);
    }
  }
  if (S.debts.length > 0 && chance(0.4)) {
    const d = pick(S.debts);
    log(pick([
      `DC ${d.src} spam WA: "BAYAR HUTANG LO KOPLAK!"`,
      `${d.src} telpon mama lo. Mama nelpon balik: "kamu kenapa?"`,
      `Foto wajah lo di-share grup WA kompleks oleh DC ${d.src}.`,
      `${d.src} ancam "akan tindak hukum". Lo googling, ternyata bohong.`,
      `DC ${d.src} dateng ke kos, ngerudet 30 menit, ibu kos liatin lo aneh.`
    ]), 'bad');
    S.stats.stress = clamp(S.stats.stress + irand(4, 9), 0, 100);
  }
  // daysToPay pakai selisih absolut — payday sudah absolut sejak v2 fix
  const daysToPay = S.payday > 0 ? Math.max(0, S.payday - S.day) : 99;
  if (daysToPay > 0 && daysToPay <= 5 && S.money < 200000) {
    S.stats.stress = clamp(S.stats.stress + 4, 0, 100);
    if (chance(0.5)) log(`Tanggal tua. Saldo ${rupiah(S.money)}. Mental tested.`, 'bad');
  }
  if (chance(0.06)) megaEvent();
}

function megaEvent() {
  pick([
    () => { log('BBM naik Rp 1.500. Semua biaya transport naik bulan ini.', 'event'); S.stats.stress = clamp(S.stats.stress + 8, 0, 100); },

      sub: 'cafe / angkringan', cost: rupiah(harga),
      can: () => S.money >= harga - 10000,
      run() { doNongkrong(harga); }
    });
  }

  // 8. Healing (kalau stress >= 40 & saldo cukup) — random 3 dari pool
  if (S.stats.stress >= 40 && S.money >= 50000) {
    const healingPool = [
      { label: 'Jalan pagi sendirian', harga: 0, stress: 12, happy: 8 },
      { label: 'Rebahan + podcast favorit', harga: 0, stress: 10, happy: 6 },
      { label: 'Masak sendiri di rumah', harga: 15000, stress: 14, happy: 10 },
      { label: 'Ngobrol curhat sama bestie', harga: 0, stress: 16, happy: 12 },
      { label: 'Konser musik indie', harga: 250000, stress: 32, happy: 20 },
      { label: `Workshop hobi (${S.char.hobi})`, harga: 280000, stress: 28, happy: 22 },
      { label: 'Spa + massage 2 jam', harga: 500000, stress: 45, happy: 18 },
      { label: 'Solo travel kota sebelah', harga: 350000, stress: 38, happy: 15, dur: 1 },
      { label: 'Sewa Airbnb 1 malam', harga: 600000, stress: 42, happy: 18, dur: 1 },
      { label: 'Beli skincare baru', harga: 380000, stress: 22, happy: 14 },
      { label: 'Therapy session', harga: 450000, stress: 50, happy: 10, trauma: -10 },
      { label: 'Karaoke private + bestie', harga: 220000, stress: 35, happy: 20 },
      { label: 'Liburan ke Bali 3 hari', harga: 2500000, stress: 75, happy: 30, dur: 3 },
    ];
    const some = pickN(healingPool, 4);
    out.push({
      id: 'healing', type: 'good', title: 'Healing', sub: 'bahasa anak senja: keluar uang',
      cost: '', can: () => true,
      run() {
        openModal({
          title: 'Healing apa?',
          sub: 'Bahagia sementara, tagihan menetap.',
          choices: some.map(h => ({
            label: `${h.label} — ${rupiah(h.harga)}`,
            hint: `stress -${h.stress}, happy +${h.happy}${h.dur ? ', skip ' + h.dur + ' hari' : ''}`,
            disabled: S.money < h.harga,
            run: () => doHealing(h)
          })),
          cancellable: true
        });
      }
    });
  }

  // 9. Godaan — random 3
  if (tod >= 1) {
    const godaanPool = [
      { id: 'judol', label: 'Judi online slot', sub: 'jackpot 7%, kalah 93%' },
      { id: 'doomscroll', label: 'Doomscroll 4 jam', sub: 'energi habis, FYP rusak otak' },
      { id: 'shopee', label: 'Shopee impulse 250rb', sub: '7 item dateng, 1 berguna' },
      { id: 'vape', label: 'Vape pod baru', sub: 'addiction +1' },
      { id: 'rokok', label: 'Beli rokok sebungkus', sub: 'health- stress-' },
      { id: 'judol-besar', label: 'Live judi internasional', sub: 'risiko ekstrim' },
      { id: 'gacha', label: 'Top up gacha game', sub: 'banner SSR, dompet kosong' }
    ];
    const some = pickN(godaanPool, 3);
    out.push({
      id: 'godaan', type: 'bad', title: 'Godaan',
      sub: 'jalur destruktif', cost: 'mental kena',
      can: () => true,
      run() {
        openModal({
          title: 'Yakin?', sub: 'Dopamine sementara, problem permanent.',
          choices: some.map(g => ({ label: g.label, hint: g.sub, run: () => doGodaan(g) })),
          cancellable: true
        });
      }
    });
  }

  // 10. Pinjol darurat
  if (S.money < 200000 && tod <= 2) {
    out.push({
      id: 'pinjol', type: 'bad', title: 'Pinjam Pinjol',
      sub: 'instant cair, bunga gila', cost: 'jalan terakhir',
      can: () => true,
      run() {
        const amt = chance(0.5) ? 1000000 : 500000;
        const bungaPick = chance(0.5) ? 0.35 : 0.18;
        const src = bungaPick > 0.25 ? pick(['Pinjol ilegal "AyoCair"','Pinjol ilegal "DanaKilat"','DC ilegal "BoosterDana"']) : 'Pinjol legal OJK';
        openModal({
          title: 'Pinjam ' + rupiah(amt) + '?',
          sub: src + ' • bunga ' + (bungaPick * 100).toFixed(0) + '%/bulan',
          choices: [
            { label: 'Cairkan sekarang', hint: 'dapat ' + rupiah(amt) + ' instan', run: () => {
              S.money += amt;
              S.debts.push({ src, amount: Math.round(amt * (1 + bungaPick * 0.3)), bunga: bungaPick });
              log(`Cair ${rupiah(amt)} dari ${src}. Hidup lo sekarang milik mereka.`, 'bad');
              S.stats.stress += 8;
              S.actionTaken = true;
              advanceTime();
            }}
          ],
          cancellable: true
        });
      }
    });
  }

  // 11. Bayar tagihan
  if (S.debts.length > 0 || S.pendingBills.kontrakan) {
    out.push({
      id: 'bayar', title: 'Bayar Tagihan',
      sub: S.debts.length + ' hutang' + (S.pendingBills.kontrakan ? ' + kontrakan' : ''),
      cost: '', can: () => true,
      run() { doBayarTagihan(); }
    });
  }

  // 12. Pindah kota
  if (S.money >= 1500000 && S.day > 5 && tod <= 1) {
    out.push({
      id: 'pindah', title: 'Pindah Kota', sub: 'reset lingkungan', cost: 'Rp 1.5jt',
      can: () => true,
      run() { doPindahKota(); }
    });
  }

  // 13. Kunjungi relasi (random pilih 1 relasi)
  if (S.relations.length > 0 && tod >= 1 && tod <= 2 && S.stats.energi >= 10) {
    const friends = S.relations.filter(x => x.type !== 'musuh');
    if (friends.length > 0) {
      const r = pick(friends);
      out.push({
        id: 'visit', type: 'good', title: 'Kunjungi ' + r.label,
        sub: 'trust +, kadang drama',
        cost: 'energi -8', can: () => true,
        run() { doVisitRelation(r); }
      });
    }
  }

  // 14. Kerja bakti RT (weekend / hari ke-7)
  if (S.day % 7 === 0 && tod <= 1) {
    out.push({
      id: 'rt', title: 'Kerja Bakti RT', sub: 'reputasi tetangga',
      cost: 'energi -15', can: () => true,
      run() {
        S.stats.energi -= 15;
        S.stats.stress = clamp(S.stats.stress - 2, 0, 100);
        log('Kerja bakti RT. Ngobrol sama Pak RT 1 jam soal sound horeg tetangga.', '');
        if (chance(0.3)) {
          S.hidden.ordal += 2;
          log('Pak RT inget muka lo. "Anak baik," katanya.', 'good');
        }
        S.actionTaken = true;
        advanceTime();
      }
    });
  }

  // 15. Olahraga ringan (gratis, selalu bisa pagi)
  if (tod === 0 && S.stats.energi >= 15) {
    out.push({
      id: 'olahraga', type: 'good', title: 'Olahraga',
      sub: 'lari/push-up/stretching • gratis',
      cost: 'energi -10',
      can: () => true,
      run() {
        S.stats.energi = clamp(S.stats.energi - 10, 0, 100);
        S.stats.stress = clamp(S.stats.stress - 12, 0, 100);
        S.stats.health = clamp(S.stats.health + 5, 0, 100);
        S.stats.happiness = clamp(S.stats.happiness + 6, 0, 100);
        log(pick([
          'Lari pagi 30 menit. Endorphin hits beda dari kafein.',
          'Push-up 3 set sampe nyerah. Badan capek, pikiran jernih.',
          'Stretching di lantai kamar. Tulang bunyi semua, normal.',
          'Senam di taman. Ikutan sama ibu-ibu, gak ada yang protes.'
        ]), 'good');
        S.actionTaken = true;
        advanceTime();
      }
    });
  }

  // 16. Dzikir / meditasi (gratis, malam atau pagi)
  if (tod === 0 || tod === 3) {
    out.push({
      id: 'meditasi', type: 'good', title: 'Dzikir / Meditasi',
      sub: 'tenangkan pikiran • gratis',
      cost: '',
      can: () => true,
      run() {
        S.stats.stress = clamp(S.stats.stress - 10, 0, 100);
        S.stats.happiness = clamp(S.stats.happiness + 5, 0, 100);
        S.hidden.trauma = clamp(S.hidden.trauma - 2, 0, 100);
        log(pick([
          'Dzikir sebelum tidur. Pikiran lebih pelan dari biasanya.',
          'Sholat tahajud + doa panjang. Ngerasa agak manusia lagi.',
          'Meditasi 10 menit. Masalah sama, tapi kepala lebih dingin.',
          'Baca Al-Quran sebentar. Tenang yang susah dijelasin.',
          'Duduk diam di teras, ngelihat langit. Udah cukup itu.'
        ]), 'good');
        S.actionTaken = true;
        advanceTime();
      }
    });
  }

  // 17. Resign tanpa kerjaan pengganti
  if (S.job !== 'pengangguran' && tod <= 1) {
    out.push({
      id: 'resign', type: 'bad', title: 'Resign',
      sub: 'keluar tanpa cadangan',
      cost: 'gaji pro-rata cair',
      can: () => true,
      run() {
        openModal({
          title: 'Resign?',
          sub: 'Keluar tanpa kerjaan pengganti.',
          body: `Gaji pro-rata hari kerja sejak gajian terakhir akan cair. Setelah ini lo jadi pengangguran — cari kerja baru sendiri.`,
          choices: [
            { label: 'Ya, resign sekarang', hint: 'jadi pengangguran, gaji pro-rata cair', run: () => {
              const oldJob = PEKERJAAN.find(j => j.id === S.job);
              payFinalSalary(oldJob, 'resign');
              log(`Lo resign dari ${oldJob?.nama || 'kerjaan'}. Tanpa pekerjaan pengganti. Leganya 10 menit.`, 'bad');
              S.stats.stress = clamp(S.stats.stress - 5, 0, 100);
              S.stats.happiness = clamp(S.stats.happiness - 8, 0, 100);
              S.job = 'pengangguran'; S.jobStreak = 0;
              S.payday = 0; S.lastPaidDay = 0; S.salaryMult = 1;
              addMission('cariKerja');
              S.actionTaken = true;
              advanceTime();
            }}
          ],
          cancellable: true
        });
      }
    });
  }

  // ---- end generateAvailableActions ----
  return out;
}

// ============ FINAL SALARY HELPER ============
// Hitung dan bayar gaji terakhir saat keluar kerja.
// mode: 'resign' (pindah kerja / berhenti, pro-rata hari kerja) | 'phk' (pesangon: full / setengah / nihil)
function payFinalSalary(p, mode) {
  if (!p || p.id === 'pengangguran' || p.harian || p.viral) return;
  // harian: gaji dibayar tiap kerja, tidak ada gaji tertunda.
  // viral: penghasilan dari konten saat itu juga.
  const mult = S.salaryMult || 1;
  // gaji bulanan acuan: kalau pernah gajian, pake nilai terakhir; kalau belum, hitung dari range.
  const fullGaji = S.lastSalary > 0
    ? S.lastSalary
    : Math.round(((p.gaji[0] + p.gaji[1]) / 2) * mult);

  if (mode === 'resign') {
    // Pro-rata: hitung berapa hari sejak gajian terakhir / mulai kerja (absolut).
    // Cap di 30 hari supaya nggak overshoot kalau player keluar persis di hari gajian.
    const hariKerja = Math.max(0, Math.min(30, S.day - (S.lastPaidDay || S.day)));
    const proRata = Math.max(0, Math.round(fullGaji * hariKerja / 30));
    if (proRata > 0) {
      S.money += proRata;
      log(`Gaji pro-rata ${hariKerja} hari kerja cair: ${rupiah(proRata)}.`, 'good');
      showToast('GAJI PRO-RATA', rupiah(proRata));
    } else {
      log('Baru mulai kerja, belum sempat gajian. Cuma kasih CV.', '');
    }
  } else if (mode === 'phk') {
    // Pesangon: luck & jobStreak menentukan seberapa banyak.
    const luckFactor = (S.hidden.luck || 50) / 100;
    const streakBonus = Math.min((S.jobStreak || 0) / 200, 0.3); // max +30% kalau lama kerja
    const roll = Math.random();
    let pesangon = 0;
    let keterangan = '';
    if (roll < 0.15 + luckFactor * 0.1) {
      // Pesangon penuh: 1 bulan gaji + bonus streak.
      pesangon = Math.round(fullGaji * (1 + streakBonus));
      keterangan = 'pesangon penuh';
    } else if (roll < 0.55 + luckFactor * 0.15) {
      // Setengah bulan
      pesangon = Math.round(fullGaji * 0.5);
      keterangan = 'pesangon setengah bulan';
    } else {
      // Nihil — PHK langsung tanpa pesangon
      pesangon = 0;
      keterangan = 'tanpa pesangon';
    }
    if (pesangon > 0) {
      S.money += pesangon;
      log(`PHK: ${keterangan} ${rupiah(pesangon)} cair.`, 'good');
      showToast('PESANGON', rupiah(pesangon));
    } else {
      log(`PHK: ${keterangan}. Langsung beres-beres meja.`, 'bad');
    }
  }
  // Reset tracking — yang udah keluar dari kerjaan ini
  S.lastSalary = 0;
  S.lastPaidDay = 0;
  S.salaryMult = 1;
}

function doWork(p) {
  const luckBonus = S.hidden.luck / 200;
  const performance = clamp(0.4 + (S.skills['kerja keras'] || 30) / 200 + luckBonus + rand(-0.15, 0.15), 0, 1);
  S.stats.energi = clamp(S.stats.energi + p.energi, 0, 100);
  // stress dari kerja dikurangi 30% — burnout tetap ada tapi lebih realistis
  S.stats.stress = clamp(S.stats.stress + Math.round(p.stress * 0.7), 0, 100);

  if (p.harian) {
    const gaji = Math.round(rand(p.gaji[0], p.gaji[1]) * performance);
    S.money += gaji;
    log(`Kerja ${p.nama}. Dapat ${rupiah(gaji)}.`, 'good');
  } else if (p.viral) {
    if (chance(0.3 + S.skills['public speaking'] / 300)) {
      const dapet = Math.round(rand(p.gaji[0], p.gaji[1]) * (0.3 + performance) * 0.2);
      if (dapet > 0) {
        S.money += dapet;
        S.viralCounter++;
        log(`Konten lo dapat traction. Adsense + endorse ${rupiah(dapet)}.`, 'good');
      } else {
        log('Bikin konten, engagement 12. Algoritma kayak mantan: ghosting.', 'bad');
      }
    } else {
      log('Bikin konten, edit 4 jam, posting, like 8.', 'bad');
      S.stats.happiness = clamp(S.stats.happiness - 4, 0, 100);
    }
  } else {
    log(`Kerja ${p.nama}. Hari biasa: meeting yang harusnya email.`, '');
    S.jobStreak++;
    if (S.jobStreak > 0 && S.jobStreak % 20 === 0) {
      if (performance > 0.7 && chance(0.4)) {
        // Naik gaji per-player, JANGAN mutate PEKERJAAN global (bug lama: bocor antar game/karakter).
        S.salaryMult = (S.salaryMult || 1) * 1.1;
        log('Bos acknowledge kerjaan lo. Gaji naik 10% bulan depan.', 'good');
      } else if (performance < 0.4 && chance(0.3)) {
        log('Bos negur di forum. Rekan kerja diam-diam nyengir.', 'bad');
        S.stats.stress += 12;
        if (chance(0.15)) {
          log('Lo di-PHK. Pengangguran lagi.', 'bad');
          const oldJob = PEKERJAAN.find(j => j.id === S.job);
          payFinalSalary(oldJob, 'phk');
          S.job = 'pengangguran'; S.jobStreak = 0;
          addMission('cariKerja');
        }
      }
    }
  }
  if (p.moral) S.hidden.trauma = clamp(S.hidden.trauma - p.moral, 0, 100);
  if (p.danger && chance(0.06)) {
    log('Hampir kecelakaan kerja. Helm aja masih utang ke koperasi.', 'bad');
    S.stats.health -= 8; S.stats.stress += 12;
  }
  S.skills['kerja keras'] = clamp((S.skills['kerja keras'] || 30) + 0.7, 0, 100);
  S.actionTaken = true;
  advanceTime();
}

function doApplyJob() {
  S.stats.energi -= 10;
  S.lastJobApplyDay = S.day;
  const peluangBase = { tinggi: 0.45, sedang: 0.30, rendah: 0.18 }[S.lokasi.peluang];
  const peluang = peluangBase + S.hidden.ordal / 200;

  let pool = PEKERJAAN.filter(p => p.id !== 'pengangguran' && p.id !== S.job);
  if (S.lokasi.neighId === 'area-tambang') pool = pool.filter(p => p.id === 'tambang' || p.tier <= 2);
  if (S.lokasi.neighId === 'kampung-nelayan' || S.lokasi.neighId === 'desa-sawit') pool = pool.filter(p => p.tier <= 2);
  if (S.lokasi.neighId === 'scbd' || S.lokasi.neighId === 'kemang' || S.lokasi.neighId === 'pik') pool = pool.filter(p => p.tier >= 3);
  if (S.lokasi.kota === 'Bali Wisata' && chance(0.4)) pool.unshift(PEKERJAAN.find(p => p.id === 'cafe-bali'));

  const tawaran = pick(pool);

  if (chance(peluang)) {
    // Komunikasi siklus gaji jelas di body modal supaya player paham kapan duitnya turun
    const cycleInfo = tawaran.harian
      ? 'Bayaran cair tiap selesai kerja (harian).'
      : tawaran.viral
      ? 'Penghasilan tiap upload konten, gak ada gaji tetap.'
      : 'Gajian bulanan (~30 hari sekali).';
    openModal({
      title: 'DITERIMA!', sub: 'Posisi: ' + tawaran.nama,
      body: `Gaji: ${rupiah(tawaran.gaji[0])}–${rupiah(tawaran.gaji[1])}${tawaran.harian ? '/hari' : '/bulan'}. Stress ~${tawaran.stress}. Energi -${Math.abs(tawaran.energi)}.<br><br><strong>${cycleInfo}</strong>`,
      choices: [
        { label: 'Terima', run: () => {
          // Kalau masih kerja, bayar gaji pro-rata hari kerja sebelum pindah
          if (S.job !== 'pengangguran') {
            const oldJob = PEKERJAAN.find(j => j.id === S.job);
            payFinalSalary(oldJob, 'resign');
          }
          S.job = tawaran.id; S.jobStreak = 0;
          // Reset multiplier gaji (mulai dari kerjaan baru = 100%)
          S.salaryMult = 1;
          S.lastSalary = 0;
          if (tawaran.harian || tawaran.viral) {
            // Job harian / viral: bayaran per aksi kerja, gak ada payday cycle
            S.lastPaidDay = S.day;
            S.payday = 0;
            log(`Lo sekarang ${tawaran.nama}. ${cycleInfo}`, 'good');
          } else {
            // Gajian pertama 10–16 hari setelah mulai kerja (absolut, bukan modulo)
            const daysToFirst = irand(10, 16);
            S.payday = S.day + daysToFirst;
            S.lastPaidDay = S.day; // anchor pro-rata dari hari mulai
            log(`Lo sekarang ${tawaran.nama}. Gajian pertama ~${daysToFirst} hari lagi (hari ke-${S.payday}).`, 'good');
            showToast('KERJA BARU', `Gajian pertama ${daysToFirst} hari lagi`);
          }
          markMissionDone('cariKerja');
          S.actionTaken = true;
          advanceTime();
        }},
        { label: 'Tolak (gengsi)', run: () => {
          log(`Tolak ${tawaran.nama}. Ego full, dompet kosong.`, '');
          S.stats.happiness += 2;
          S.actionTaken = true;
          advanceTime();
        }}
      ],
      cancellable: false
    });
  } else {
    log('Lamar kerja: ditolak. Alasan: ' + pick([
      'HR ghosting setelah interview',
      'kalah sama anak ordal kepala bagian',
      '"butuh fresh graduate dengan pengalaman 5 tahun"',
      'gaji ditawar ke setengah, lo nolak',
      'tes psikotes pakai bahasa asing',
      'WhatsApp HR "kami akan menghubungi" — sampe sekarang',
      'kalah cepet sama 437 pelamar lain'
    ]) + '.', 'bad');
    S.stats.stress += 5;
    S.stats.happiness -= 3;
    S.actionTaken = true;
    advanceTime();
  }
}

function doHustle(h) {
  S.stats.energi = clamp(S.stats.energi - h.energy, 0, 100);
  if (h.modal) S.money -= h.modal;
  const skillBonus = h.skill ? (S.skills[h.skill] || 0) / 200 : 0;
  const luckBonus = S.hidden.luck / 300;
  const actualRisk = clamp(h.risk - skillBonus - luckBonus, 0.05, 0.95);
  if (chance(actualRisk)) {
    log(`Hustle "${h.label}": zonk. ${h.modal ? 'Modal nyangkut, ' : ''}mental tested.`, 'bad');
    S.stats.stress = clamp(S.stats.stress + 6, 0, 100);
    if (h.moral) S.hidden.trauma += Math.abs(h.moral);
  } else {
    const profit = irand(Math.max(0, h.min), h.max);
    S.money += profit;
    log(`Hustle "${h.label}": profit ${rupiah(profit)}.`, 'good');
    if (h.skill) S.skills[h.skill] = clamp((S.skills[h.skill] || 0) + 1, 0, 100);
  }
  markMissionDone('nyobaHustle');
  S.actionTaken = true;
  advanceTime();
}

function doNongkrong(harga) {
  if (S.money < harga) harga = Math.min(S.money, 25000);
  S.money -= harga;
  S.stats.happiness = clamp(S.stats.happiness + 12, 0, 100);
  S.stats.stress = clamp(S.stats.stress - 14, 0, 100);
  S.stats.hygiene = clamp(S.stats.hygiene - 3, 0, 100);
  S.hidden.loneliness = clamp(S.hidden.loneliness - 5, 0, 100);
  const friends = S.relations.filter(x => x.type !== 'musuh');
  if (friends.length > 0) {
    const r = pick(friends);
    r.trust = clamp(r.trust + irand(2, 8), 0, 100);
    log(`Nongkrong sama ${r.label}. Ngobrol receh, tapi enak.`, 'good');
  } else log('Nongkrong sendiri di cafe. Doomscroll juga sih intinya.', '');
  if (chance(0.2) && S.relations.length < 12) {
    const newRel = pick(RELASI_TEMPLATE.filter(t => !S.relations.find(r => r.label === t.label)));
    if (newRel) {
      S.relations.push({ label: newRel.label, type: newRel.type, trust: irand(20, 50), debt: 0 });
      log(`Kenalan baru: ${newRel.label}.`, 'good');
    }
  }
  S.actionTaken = true;
  advanceTime();
}

function doHealing(h) {
  if (S.money < h.harga) return;
  S.money -= h.harga;
  S.stats.stress = clamp(S.stats.stress - h.stress, 0, 100);
  S.stats.happiness = clamp(S.stats.happiness + h.happy, 0, 100);
  if (h.trauma) S.hidden.trauma = clamp(S.hidden.trauma + h.trauma, 0, 100);
  log(`Healing: ${h.label}. Bahagia sementara, tagihan menetap.`, 'good');
  S.actionTaken = true;
  if (h.dur) {
    for (let i = 0; i < h.dur && S && !S.dead; i++) {
      S.timeOfDay = 3;
      advanceTime(true);
    }
  } else advanceTime();
}

function doGodaan(g) {
  if (g.id === 'judol') doJudol(50000);
  else if (g.id === 'judol-besar') doJudol(200000);
  else if (g.id === 'doomscroll') {
    S.stats.energi = clamp(S.stats.energi - 25, 0, 100);
    S.stats.stress = chance(0.5) ? clamp(S.stats.stress - 4, 0, 100) : clamp(S.stats.stress + 8, 0, 100);
    S.addictions['Doomscroll'] = (S.addictions['Doomscroll'] || 0) + 1;
    log('Doomscroll FYP. Algoritma kasih politik, kucing, drama mantan idol. Otak puyeng.', 'bad');
  } else if (g.id === 'shopee') {
    if (S.money < 250000) { log('Saldo kurang. Untung selamat.', ''); S.actionTaken = true; advanceTime(); return; }
    S.money -= 250000;
    S.stats.happiness = clamp(S.stats.happiness + 10, 0, 100);
    S.stats.stress = clamp(S.stats.stress - 3, 0, 100);
    S.addictions['Shopping'] = (S.addictions['Shopping'] || 0) + 1;
    log('Checkout 7 item. Yang berguna 1. Yang nyangkut 6.', 'bad');
  } else if (g.id === 'vape') {
    if (S.money < 180000) { log('Saldo nggak cukup buat pod baru.', ''); S.actionTaken = true; advanceTime(); return; }
    S.money -= 180000;
    S.addictions['Vape'] = (S.addictions['Vape'] || 0) + 1;
    S.stats.health -= 3; S.stats.stress = clamp(S.stats.stress - 5, 0, 100);
    log('Coil baru, juice mint, hisap di parkiran kantor.', '');
  } else if (g.id === 'rokok') {
    if (S.money < 30000) { log('Saldo nggak cukup sebungkus.', ''); S.actionTaken = true; advanceTime(); return; }
    S.money -= 30000;
    S.addictions['Rokok'] = (S.addictions['Rokok'] || 0) + 1;
    S.stats.health -= 4; S.stats.stress = clamp(S.stats.stress - 6, 0, 100);
    log('Sebatang dulu. Lo bilang gitu sejak 3 tahun lalu.', '');
  } else if (g.id === 'gacha') {
    const amt = irand(100000, 400000);
    if (S.money < amt) { log('Mau top up, saldo kurang. Untung.', ''); S.actionTaken = true; advanceTime(); return; }
    S.money -= amt;
    S.addictions['Gacha'] = (S.addictions['Gacha'] || 0) + 1;
    if (chance(0.1)) {
      log(`Top up ${rupiah(amt)}. JACKPOT SSR! Dopamine 12 jam.`, 'event');
      S.stats.happiness += 15;
    } else {
      log(`Top up ${rupiah(amt)}. Pity belum cukup. Lagi.`, 'bad');
      S.stats.stress += 4;
    }
  }
  S.actionTaken = true;
  advanceTime();
}

function doJudol(bet) {
  if (S.money < bet) { log('Mau judol, saldo nggak cukup. Untung.', ''); return; }
  S.money -= bet;
  S.addictions['Judol'] = (S.addictions['Judol'] || 0) + 1;
  if (chance(0.07)) {
    const win = bet * irand(8, 25);
    S.money += win;
    log(`JACKPOT! Menang ${rupiah(win)}. Otak: "ini skill bukan luck".`, 'event');
    S.stats.happiness += 15;
    if (chance(0.7)) {
      log('Spin lagi sekali. Pasti hoki.', '');
      setTimeout(() => { doJudol(bet); render(); }, 300);
    }
  } else {
    log(`Kalah ${rupiah(bet)}. Spin lagi. Spin terus.`, 'bad');
    S.stats.stress = clamp(S.stats.stress + 6, 0, 100);
    S.hidden.trauma += 1;
    if ((S.addictions['Judol'] || 0) > 5 && chance(0.3)) {
      log('Lo sadar lagi tenggelam. Tapi besok pasti hoki, kan?', 'bad');
    }
  }
}

function doBayarTagihan() {
  const choices = [];
  if (S.pendingBills.kontrakan) {
    choices.push({
      label: `Bayar kontrakan ${rupiah(S.bills.kontrakan)}`,
      hint: 'jatuh tempo!',
      disabled: S.money < S.bills.kontrakan,
      run: () => {
        S.money -= S.bills.kontrakan;
        S.pendingBills.kontrakan = false;
        S.bills.kontrakanOverdueSince = null;
        log('Kontrakan lunas. Ibu kos sekarang baik 3 hari ke depan.', 'good');
        S.stats.stress = clamp(S.stats.stress - 5, 0, 100);
        S.actionTaken = true; advanceTime();
      }
    });
  }
  S.debts.forEach((d, idx) => {
    choices.push({
      label: `Lunasi ${d.src} — ${rupiah(d.amount)}`,
      hint: `bunga ${(d.bunga * 100).toFixed(0)}%/bulan`,
      disabled: S.money < d.amount,
      run: () => {
        S.money -= d.amount;
        S.debts.splice(idx, 1);
        log(`LUNAS ${d.src}. Lega seperti baru selesai BAB.`, 'good');
        S.stats.stress = clamp(S.stats.stress - 15, 0, 100);
        S.stats.happiness = clamp(S.stats.happiness + 8, 0, 100);
        S.actionTaken = true; advanceTime();
      }
    });
    const cicil = Math.min(S.money, Math.round(d.amount * 0.3));
    if (cicil >= 50000) {
      choices.push({
        label: `Cicil ${rupiah(cicil)} ke ${d.src}`,
        hint: 'bunga tetap jalan',
        run: () => {
          S.money -= cicil;
          d.amount -= cicil;
          log(`Cicil ${rupiah(cicil)} ke ${d.src}.`, '');
          S.stats.stress = clamp(S.stats.stress - 2, 0, 100);
          S.actionTaken = true; advanceTime();
        }
      });
    }
  });
  openModal({ title: 'Bayar apa?', sub: 'Hidup adalah utang.', choices, cancellable: true });
}

function doPindahKota() {
  const candidates = [];
  for (let i = 0; i < 4; i++) {
    const pulauName = pick(Object.keys(PULAU));
    candidates.push({ pulauName, kota: pick(PULAU[pulauName]), neigh: pick(NEIGHBORHOOD_ARCH) });
  }
  openModal({
    title: 'Pindah ke mana?', sub: 'Biaya pindah Rp 1.5jt. Kerjaan ilang — gaji terakhir pro-rata cair.',
    choices: candidates.map(c => ({
      label: `${c.kota} / ${c.neigh.label}`,
      hint: `${c.pulauName} • ${c.neigh.class.toUpperCase()} • biaya hidup ${Math.round(c.neigh.biaya * 100)}% • peluang ${c.neigh.peluang}`,
      run: () => {
        S.money -= 1500000;
        // Bayar gaji terakhir (pro-rata) sebelum kehilangan kerjaan karena pindah kota
        if (S.job !== 'pengangguran') {
          const oldJob = PEKERJAAN.find(j => j.id === S.job);
          payFinalSalary(oldJob, 'resign');
        }
        S.lokasi = {
          pulau: c.pulauName, kota: c.kota, neigh: c.neigh.label, neighId: c.neigh.id,
          class: c.neigh.class, biaya: c.neigh.biaya, peluang: c.neigh.peluang, vibe: c.neigh.vibe
        };
        S.job = 'pengangguran'; S.jobStreak = 0;
        S.bills.kontrakan = Math.round(c.neigh.biaya * 700000);
        S.pendingBills.kontrakan = false;
        S.bills.kontrakanOverdueSince = null;
        log(`Pindah ke ${c.kota} / ${c.neigh.label}. Hidup baru. Stress lama bawa.`, 'event');
        S.stats.stress = clamp(S.stats.stress - 8, 0, 100);
        addMission('cariKerja');
        S.actionTaken = true;
        advanceTime();
      }
    })),
    cancellable: true
  });
}

function doVisitRelation(r) {
  S.stats.energi -= 8;
  r.lastInteract = S.day;
  // Stress reduction scale by relation type: teman & romantis lebih besar karena seru
  const stressRelief = (r.type === 'romantis' || r.type === 'teman') ? 12 : 7;
  weightedPick([
    { w: 3, run: () => {
      r.trust = clamp(r.trust + irand(5, 12), 0, 100);
      S.stats.happiness = clamp(S.stats.happiness + 8, 0, 100);
      S.stats.stress = clamp(S.stats.stress - stressRelief, 0, 100);
      S.hidden.loneliness = clamp(S.hidden.loneliness - 6, 0, 100);
      log(`Kunjungi ${r.label}. Ngobrol soal hidup. Hangat.`, 'good');
    }},
    { w: 2, run: () => {
      log(`${r.label} curhat 2 jam soal mantan / pekerjaan.`, '');
      // Dengerin curhat teman tetap ada nilai, tapi sedikit drain
      S.stats.stress = clamp(S.stats.stress + 3, 0, 100);
      S.hidden.loneliness = clamp(S.hidden.loneliness - 4, 0, 100);
      r.trust = clamp(r.trust + 5, 0, 100);
    }},
    { w: 1, run: () => {
      if (S.money >= 100000) {
        log(`${r.label} pinjem uang Rp 100rb. "Bulan depan balikin pasti".`, 'event');
        S.money -= 100000; r.debt += 100000;
        r.trust = clamp(r.trust + 3, 0, 100);
      } else {
        log(`${r.label} pinjem uang tapi lo cekak. Awkward.`, '');
        r.trust = clamp(r.trust - 3, 0, 100);
      }
    }},
    { w: 1, run: () => {
      if (r.type === 'romantis') {
        if (chance(0.4)) {
          r.trust = clamp(r.trust - 10, 0, 100);
          log(`${r.label} ngambek. Drama 2 hari ke depan.`, 'bad');
          S.stats.stress = clamp(S.stats.stress + 10, 0, 100);
        } else {
          r.trust = clamp(r.trust + 10, 0, 100);
          log(`${r.label} kasih kejutan kecil. Hangat di tengah chaos.`, 'good');
          S.stats.happiness = clamp(S.stats.happiness + 12, 0, 100);
          S.stats.stress = clamp(S.stats.stress - 15, 0, 100);
        }
      } else {
        log(`Ketemuan biasa sama ${r.label}.`, '');
        S.stats.stress = clamp(S.stats.stress - 4, 0, 100);
        r.trust = clamp(r.trust + 3, 0, 100);
      }
    }}
  ]).run();
  S.actionTaken = true;
  advanceTime();
}

    { w: 1, run: () => { log('Listrik se-RT mati 3 jam karena kabel kebakar.', 'event'); S.stats.stress += 4; }},

          pacar.trust = clamp(pacar.trust - 15, 0, 100);
          log(`${pacar.label} ngambek karena "kurang perhatian". Drama 3 hari.`, 'bad');
          S.stats.stress += 10;
        } else {
          pacar.trust = clamp(pacar.trust + 10, 0, 100);
          log(`${pacar.label} kasih kejutan kecil. Rasanya hangat di tengah chaos.`, 'good');
          S.stats.happiness += 8;
        }

    { w: 0.5, run: () => {
      if (S.viralCounter > 2 && chance(0.4)) {
        log('Konten lama lo dibongkar haters. Cancel attempt. Mental kena.', 'bad');
        S.stats.stress += 15;
      } else if (chance(0.2)) {
        const hits = irand(50000, 500000);
        S.money += hits;
        S.viralCounter++;
        log(`Video lo viral. Adsense + endorse ${rupiah(hits)}.`, 'good');
      }
    }},
    { w: 1, run: () => { log('Pak RT door-to-door minta sumbangan 17 Agustus.', 'event'); if (S.money >= 25000) S.money -= 25000; }},
    { w: 1, run: () => {
      // family burden event - sandwich generation
      if (S.hidden.family_burden > 30) {
        const amt = irand(150000, 700000);
        if (chance(S.hidden.family_burden / 150)) {
          log(`WA dari rumah: "tolong transferin ${rupiah(amt)} ya nak, urgent."`, 'event');
          if (S.money >= amt && chance(0.7)) {
            S.money -= amt;
            log(`Lo transfer ${rupiah(amt)}. Anak baik. Saldo tipis.`, '');
            S.stats.stress += 5;
          } else {
            log(`Lo nggak bales WA. Guilt naik.`, 'bad');
